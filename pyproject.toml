[project]
name = "crawl4ai-mcp"
version = "0.1.0"
description = "Crawl4AI FastMCP server for agentic deep research with Google ADK"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.8",
    "crawl4ai>=0.8.6",
    "fastmcp>=3.2.4",
    "ollama>=0.6.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

